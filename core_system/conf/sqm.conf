# ==============================================================================
# Ripple-mod - Modern Traffic Scheduler & Bufferbloat Mitigation Configuration
# ==============================================================================

# Enable/Disable Smart Queue Management (Default: 0 - disabled until user configures WAN bandwidth)
SQM_ENABLED="0"

# WAN Interface (External uplink interface - leave empty for auto-detection: nas0/eth0.2)
WAN_DEV=""

# Ingress IFB Interface (for shaping download bufferbloat)
IFB_DEV="ifb0"

# Uplink (Upload) Bandwidth Limit (kbit/s)
# Set to ~90-95% of your actual WAN uplink speed to prevent bufferbloat.
# E.g., 50M upload = 50000, 100M upload = 95000. 0 = disabled.
UPLOAD_RATE_KBIT="50000"

# Downlink (Download) Bandwidth Limit (kbit/s)
# Set to ~90-95% of your actual WAN downlink speed. 0 = disabled.
DOWNLOAD_RATE_KBIT="300000"

# Queue Discipline: 'sfq' (Stochastic Fairness Queueing, built-in) or 'prio'
QDISC_TYPE="sfq"

# SFQ Perturbation Interval (seconds) - rehashes flow buckets to prevent collisions
SFQ_PERTURB="10"

# Enable DSCP Priority Tagging for Interactive & Gaming Traffic
# Maps low-delay packets into Realtek WMM Hardware AC_VO / AC_VI rings
ENABLE_DSCP_QOS="1"
