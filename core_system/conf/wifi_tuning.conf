# ==============================================================================
# Ripple-mod - Wi-Fi Radio DSP, Baseband & Scheduling Configuration
# ==============================================================================

# Enable/Disable Wi-Fi Hardware & Algorithmic Optimizations
WIFI_TUNING_ENABLED="1"

# 1. RTC7646 eFEM 23dBm Power Limit Unlock (Bypass CN Regulatory Clamp)
# Default 0: preserve stock thermal/regulatory table for 24/7 long-term stability (opt-in)
UNLOCK_TX_POWER="0"

# 2. Carrier EDCCA Backoff Deactivation (core_mib_edcca_mode = 0)
# Default 0: keep EDCCA active to avoid severe air-time collisions & retransmissions in crowded dorms
DISABLE_EDCCA_CARRIER_BACKOFF="0"

# 3. IEEE 802.11 AirTime Fairness (core_mib_atf = 1)
# Default 0: early rtk_wifi6.ko (v2.0.0.1) ATF can stall STA TX queues after 24-48h of PS/roaming
ENABLE_AIRTIME_FAIRNESS="0"

# 4. Deny Legacy 802.11b Rates (core_mib_deny_legacy = 1, 2.4GHz only)
# Default 0: preserve stock compatibility unless explicitly enabled
DENY_LEGACY_11B="0"

# 5. PCIe TRX Interrupt Mitigation Tuning
# Default 0: keep hardware interrupt coalescing enabled to prevent MIPS CPU IRQ storms under high throughput
TUNE_PCIE_INT_MIT="0"

# 6. Realtek Band Steering Engine (wlan_manager 802.11v BSS Transition Management)
# Default 0: avoid aggressive BTM/deauth loops rejecting clients on mismatched dual-band SSIDs
ENABLE_BAND_STEERING="0"
PREFER_BAND="1"               # 1: 5GHz preferred
PREFER_BAND_RSSI_HIGH="35"    # Steer threshold
PREFER_BAND_RSSI_LOW="25"     # Downgrade threshold

# 7. Unload rtk_igmp_hook.ko at runtime
# Default 0: NEVER rmmod live bridge/FleetConntrack IGMP hook module (prevents multicast/ARP/DHCP/kernel instability)
UNLOAD_IGMP_HOOK="0"
