ID=custom_userscript
NAME=自定义 Shell 脚本与第三方 MIPS 程序加载器
DESC=在开机或手动触发时执行自定义 Shell 命令，并拉起通过 SCP 上传至 /var/app/bin 的第三方 MIPS 大端序常驻程序
VERSION=1.2.0
ENTRY=start.sh
UI_TYPE=modal
UI_SCHEMA=AUTORUN_CMD:启动执行 Shell 命令:text:echo "[CustomLoader] /var/app Ready"|BG_DAEMON_BIN:后台常驻程序绝对路径:text:/var/app/bin/your_mips_binary|BG_DAEMON_ARGS:常驻程序启动参数:text:-c /var/app/conf/app.conf
