ID=hosts_adblock_dns
NAME=Dnsmasq 域名拦截与本地 DNS 缓存加速
DESC=基于系统 /bin/dnsmasq 挂载 /var/tmp/hosts 自定义域名屏蔽规则（默认拦截运营商云端遥测域名）并重载解析服务
VERSION=1.2.0
ENTRY=start.sh
UI_TYPE=modal
UI_SCHEMA=BLOCK_CMCC_TELEMETRY:屏蔽运营商遥测域名 (1=开启, 0=关闭):select:1,0|CUSTOM_DOMAINS:自定义屏蔽域名列表 (逗号分隔):text:ahsap.hejiaqin.cn,andlink.cmcc.com,ota.cmcc.com,dpi.cmcc.com,rms.chinamobile.com
